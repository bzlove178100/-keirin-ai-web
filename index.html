<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>競輪AI予想</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#fff}
.container{width:min(92%,760px);margin:auto;padding:32px 0 60px}header{text-align:center;margin-bottom:32px}
.subtitle{color:#9ca3af}.card{background:#151c2f;border:1px solid #29324a;border-radius:16px;padding:20px;margin-bottom:18px}
label{display:block;margin:14px 0 7px;font-weight:600}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #374151;background:#0f172a;color:#fff;font-size:16px}
textarea{min-height:130px}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:17px;font-weight:700}
#result{white-space:pre-wrap;line-height:1.7;color:#e5e7eb}.status{color:#60a5fa;font-weight:600}
</style>
</head>
<body>
<main class="container">
<header><h1>🚴 競輪AI予想</h1><p class="subtitle">Keirin AI Prediction System</p></header>
<section class="card">
<label for="venue">競輪場</label><input id="venue" placeholder="例：玉野">
<label for="race">レース</label>
<select id="race"><option value="">選択してください</option><option>1R</option><option>2R</option><option>3R</option><option>4R</option><option>5R</option><option>6R</option><option>7R</option><option>8R</option><option>9R</option><option>10R</option><option>11R</option><option>12R</option></select>
<label for="data">レースデータ</label><textarea id="data" placeholder="出走表・並び・オッズ・前検コメントなどを入力"></textarea>
<button id="predictButton" type="button">AI予想を実行</button>
</section>
<section class="card"><h2>予想結果</h2><div id="result">まだ予想は実行されていません。</div></section>
</main>
<script>
document.getElementById("predictButton").addEventListener("click",function(){
const venue=document.getElementById("venue").value.trim(),race=document.getElementById("race").value,data=document.getElementById("data").value.trim(),result=document.getElementById("result");
if(!venue||!race){result.textContent="競輪場とレースを入力してください。";return}
result.innerHTML='<span class="status">'+venue+" "+race+" の入力を確認しました。</span>\n\n現在はWeb画面の動作確認段階です。\n次の工程で競輪AIの予想処理と接続します。\n\n"+(data?"レースデータ：入力済み":"レースデータ：未入力");
});
</script>
</body>
</html>
