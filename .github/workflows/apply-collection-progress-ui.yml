name: apply collection progress UI

on:
  push:
    branches:
      - main
    paths:
      - tools/patch_collection_progress_ui.py
      - tests/test_collection_status_ui.cjs
      - .github/workflows/apply-collection-progress-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply collection progress UI patch
        run: python tools/patch_collection_progress_ui.py
      - name: Run collection progress UI checks
        run: node tests/test_collection_status_ui.cjs
      - name: Run existing web capture checks
        run: node tests/test_web_capture.cjs
      - name: Run base regression checks
        run: python tests/test_regression.py
      - name: Commit generated Web change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated Web change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: show prospective collection progress in web"
          git push origin HEAD:main
