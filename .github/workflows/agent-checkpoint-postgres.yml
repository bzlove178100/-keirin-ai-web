name: agent checkpoint PostgreSQL contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-limits-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify synthetic host limits and supervisor/controller recovery
        env:
          AGENT_EPHEMERAL_HOST_TEST: '1'
        run: python tests/run_host_limits_contract.py
  checkpoint-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agent_checkpoint_ci
          POSTGRES_USER: postgres
          # Disposable CI service only; never a project credential.
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test isolated checkpoint schema with PostgreSQL 17
        env:
          AGENT_EPHEMERAL_DB_TEST: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: agent_checkpoint_ci
          PGUSER: postgres
          PGPASSWORD: ephemeral-ci-only
        run: python tests/run_agent_checkpoint_postgres.py
      - name: Install pinned synthetic host test driver
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Test isolated secret host process deadlines and loopback blackholes
        timeout-minutes: 2
        run: env -u LD_LIBRARY_PATH python tests/test_postgres_secret_process.py
      - name: Test synthetic secret storage SQL and ACL contract
        timeout-minutes: 3
        env:
          AGENT_EPHEMERAL_DB_TEST: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: agent_checkpoint_ci
          PGUSER: postgres
          PGPASSWORD: ephemeral-ci-only
        run: env -u LD_LIBRARY_PATH python tests/run_vault_postgres_contract.py
      - name: Install pinned ephemeral certificate generator
        run: python -m pip install 'cryptography==46.0.0'
      - name: Test ephemeral PostgreSQL TLS, strict host and restart recovery
        timeout-minutes: 6
        env:
          AGENT_EPHEMERAL_TLS_TEST: '1'
        run: env -u LD_LIBRARY_PATH python tests/run_secret_tls_contract.py
