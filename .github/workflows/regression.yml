name: keirin-ai regression

on:
  push:
    branches:
      - main
      - dev-lightgbm-offline-inference-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run web and safety regression checks
        run: python tests/test_regression.py
      - name: Set up Node for Web capture checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Web capture checks
        run: node tests/test_web_capture.cjs
      - name: Run ML dataset safety checks
        run: python tests/test_ml_dataset.py
      - name: Run collection readiness checks
        run: python tests/test_collection_status.py
      - name: Run offline snapshot settlement checks
        run: python tests/test_settle_snapshot.py
      - name: Run trifecta adapter checks
        run: python tests/test_trifecta_adapter.py
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run engine and training-input contract tests
        run: deno test tests/phase32_contract_test.ts tests/training_input_test.ts
