name: keirin-ai regression

on:
  push:
    branches:
      - main
      - dev-golden-dataset-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression checks
        run: python tests/test_regression.py
