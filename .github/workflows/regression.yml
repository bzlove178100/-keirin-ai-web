name: keirin-ai regression

on:
  push:
    branches:
      - main
      - dev-lightgbm-offline-inference-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run web and safety regression checks
        run: python tests/test_regression.py
      - name: Run shared agent core safety checks
        run: python tests/test_agent_core.py
      - name: Verify safe action error persistence
        run: python tests/test_safe_action_errors.py
      - name: Verify persistence redaction static contract
        run: python tests/test_persistence_redaction_static.py
      - name: Verify ephemeral diagnostic sink isolation
        run: python tests/test_ephemeral_diagnostics.py
      - name: Run interrupted and competing runner checks
        run: python tests/test_agent_interruptions.py
      - name: Run immutable task identity checks
        run: python tests/test_agent_task_identity.py
      - name: Run agent orchestration and reporting checks
        run: python tests/test_agent_orchestration.py
      - name: Run queue planning and interrupted-worker safety checks
        run: python tests/test_agent_queue_planner.py
      - name: Run runtime bridge and delivery checks
        run: python tests/test_agent_runtime_bridge.py
      - name: Run live GitHub host bridge unit checks
        run: python tests/test_agent_github_readonly_host.py
      - name: Verify SHA-pinned GitHub observation and CI
        run: python tests/test_agent_github_sha_bridge.py
      - name: Verify closed hosted repository composition and interrupted persistence
        run: python tests/test_hosted_repository_worker.py
      - name: Verify exact trusted run-instance worker binding
        run: python tests/test_hosted_run_instance_worker.py
      - name: Verify read-only hosted recovery classification
        run: python tests/test_hosted_recovery.py
      - name: Verify proposal-only hosted recovery decisions
        run: python tests/test_hosted_recovery_proposal.py
      - name: Verify closed single-run activation manifest
        run: python tests/test_hosted_activation_manifest.py
      - name: Verify manual one-shot workflow safety contract
        run: python tests/test_manual_one_shot_workflow.py
      - name: Verify redacted runtime credential preflight
        run: python tests/test_runtime_credentials.py
      - name: Verify credential provider isolation and lifetime boundary
        run: python tests/test_credential_provider.py
      - name: Verify access-only credential refresh state machine
        run: python tests/test_refresh_credentials.py
      - name: Verify versioned refresh secret CAS and ambiguous-outcome recovery
        run: python tests/test_versioned_secret_store.py
      - name: Verify durable secret-store adapter contract
        run: python tests/test_durable_secret_store.py
      - name: Verify bounded PostgreSQL host adapter with synthetic faults
        run: python tests/test_postgres_secret_backend.py
      - name: Verify unbound PostgreSQL host connection profile
        run: python tests/test_postgres_host_profile.py
      - name: Verify strict host factory rejection and session preflight
        run: python tests/test_postgres_host_factory.py
      - name: Verify pinned CA snapshots and kernel seals
        run: python tests/test_host_trust.py
      - name: Verify child OS safeguards and pre-spawn environment rejection
        # Provision a clean test interpreter before startup; production rejects overrides.
        run: env -u LD_LIBRARY_PATH python tests/test_host_process_safety.py
      - name: Test synthetic parent crash child termination
        timeout-minutes: 2
        run: env -u LD_LIBRARY_PATH python tests/test_secret_parent_death.py
      - name: Test synthetic host qualification gates and cleanup
        run: python tests/test_host_limits_fixture.py
      - name: Test pinned launcher and image provenance contract
        run: python tests/test_launcher_image_contract.py
      - name: Test supervisor exit and reaping evidence guards
        run: python tests/test_host_supervisor_contract.py
      - name: Test synthetic controller recovery identity and no-replay guards
        run: python tests/test_host_controller_recovery.py
      - name: Test synthetic network and logging evidence rejection
        run: python tests/test_network_logging_contract.py
      - name: Test exclusive-network approved-destination egress guards
        run: python tests/test_egress_allowlist_contract.py
      - name: Verify reusable durable backend conformance harness
        run: python tests/test_durable_backend_conformance.py
      - name: Verify synthetic SQLite backend across processes
        run: python tests/test_sqlite_test_backend.py
      - name: Verify credential-gated provider action boundary
        run: python tests/test_credential_adapter.py
      - name: Verify durable credential stack composition
        run: python tests/test_credential_stack.py
      - name: Verify trusted run-instance scope
        run: python tests/test_trusted_run_instance.py
      - name: Verify trusted run-instance enqueue boundary
        run: python tests/test_trusted_run_enqueue.py
      - name: Verify hosted recovery factory construction
        run: python tests/test_prepare_hosted_recovery.py
      - name: Verify hard hosted run deadline
        run: python tests/test_hosted_hard_deadline.py
      - name: Verify broad agent capability contracts
        run: python tests/test_agent_capability_catalog.py
      - name: Verify hosted state schema activation contract
        run: python tests/test_agent_hosted_state_schema.py
      - name: Verify activity persistence migration safety
        run: python tests/test_agent_activity_migration.py
      - name: Verify hosted checkpoint client integrity and CAS behavior
        run: python tests/test_hosted_checkpoint_client.py
      - name: Verify hosted activity ledger client behavior
        run: python tests/test_hosted_activity_client.py
      - name: Verify hosted queue lease and fencing client behavior
        run: python tests/test_hosted_queue_client.py
      - name: Verify exact-task queue claim client behavior
        run: python tests/test_exact_task_queue.py
      - name: Verify fail-closed hosted worker coordination
        run: python tests/test_hosted_worker_coordinator.py
      - name: Verify explicitly gated read-only hosted execution
        run: python tests/test_hosted_readonly_worker.py
      - name: Verify hosted Edge transport credential isolation and failure handling
        run: python tests/test_hosted_transport.py
      - name: Verify exact-claim Edge routing isolation
        run: python tests/test_exact_claim_routing_transport.py
      - name: Set up Node for Web capture checks
        uses: actions/setup-node@v4
      - name: Run Web capture checks
        run: node tests/test_web_capture.cjs
      - name: Run browser-local prospective tools checks
        run: node tests/test_prospective_tools.cjs
      - name: Run private history bundle checks
        run: node tests/test_prospective_history_bundle.cjs
      - name: Run prospective tools launcher checks
        run: node tests/test_prospective_tools_link.cjs
      - name: Run ML dataset safety checks
        run: python tests/test_ml_dataset.py
      - name: Run collection readiness checks
        run: python tests/test_collection_status.py
      - name: Run offline snapshot settlement checks
        run: python tests/test_settle_snapshot.py
      - name: Run trifecta adapter checks
        run: python tests/test_trifecta_adapter.py
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check hosted runtime and exact-claim entrypoints
        run: deno check supabase/functions/agent-runtime-dev/index.ts supabase/functions/agent-exact-claim-dev/index.ts
      - name: Run engine, training-input, hosted runtime, and exact-claim contract tests
        run: deno test tests/phase32_contract_test.ts tests/training_input_test.ts tests/agent_runtime_dev_test.ts tests/agent_exact_claim_dev_test.ts

  custody-h2-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test H2a with real temporary-file ownership and synthetic host adapters
        # No real account, manager, network, or AWS operation is performed.
        run: sudo -n env H2_REQUIRE_FULL_FS_TESTS=1 /usr/bin/python3 -I -B tests/test_secret_custody_h2.py
      - name: Test H2a account CLI and failed-apply recovery in an isolated chroot
        # Real shadow executables, disposable account databases; systemd is synthetic.
        # Never changes runner accounts or accesses AWS. No skipped CLI tests.
        run: sudo -n /usr/bin/python3 -I -B tests/test_secret_custody_h2_cli.py

  custody-h2b-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test H2b output and bounded cleanup contracts
        run: /usr/bin/python3 -I -B tests/test_secret_custody_h2b.py
      - name: Test actual systemd sandbox, failed child and manager deadline
        # This disposable runner gets a temporary H2a fixture, removed by its rollback.
        # No cloud session, secret, production payload, network request or host swap change.
        run: sudo -n env H2B_CI_FIXTURE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" /usr/bin/python3 -I -B tests/test_secret_custody_h2b_systemd.py

  custody-h2c-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned validators and memory-probe failure contracts
        run: /usr/bin/python3 -I -B tests/test_secret_custody_h2c.py
      - name: Test real private tmpfs, sealed handoff, rejection and cleanup
        # Reuses the owned disposable H2a fixture; real systemd/kernel, no secrets.
        # Only the fixture's global swap precheck is synthetic; per-cgroup swap is real.
        run: sudo -n env H2B_CI_FIXTURE=1 H2C_CI_FIXTURE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" /usr/bin/python3 -I -B tests/test_secret_custody_h2c_systemd.py

  custody-h2d-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded process evidence and ownership guards
        run: /usr/bin/python3 -I -B tests/test_secret_custody_h2d.py
      - name: Test actual parent and launcher death with resistant child cleanup
        # Owned disposable H2a fixture; no secrets, AWS or host firewall changes.
        # The global swap precheck is synthetic only in this CI fixture.
        run: sudo -n env H2B_CI_FIXTURE=1 H2D_CI_FIXTURE=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" /usr/bin/python3 -I -B tests/test_secret_custody_h2d_systemd.py

  custody-network-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only network parsing, bounds and redaction
        run: /usr/bin/python3 -I -B tests/test_secret_custody_network_readback.py
      - name: Test actual nft JSON and IPv4/IPv6 socket output in a disposable namespace
        # Fixture rules/sockets exist only inside this unshare network namespace.
        # No host firewall edit, external packet, AWS session or credential.
        run: sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" unshare --net /usr/bin/python3 -I -B tests/test_secret_custody_network_readback.py --namespace-fixture
      - name: Run exact read-only observer against disposable CI host
        run: sudo -n /usr/bin/python3 -I -B review/secret_custody_network_readback.py

  custody-network-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test CI namespace guard and ownership rejection
        run: /usr/bin/python3 -I -B tests/test_secret_custody_network_transition.py
      - name: Rehearse actual IPv4 and IPv6 firewall transition and restricted rollback
        # Two isolated namespaces and a veth; no external routes or live addresses.
        # Tests refuse PID 1's network namespace, non-CI and nonempty fixtures.
        run: sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" unshare --net /usr/bin/python3 -I -B tests/test_secret_custody_network_transition.py --kernel

  custody-network-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test readiness, expiry and ownership guards
        run: /usr/bin/python3 -I -B tests/test_secret_custody_network_watchdog.py
      - name: Test PID 1 recovery after controller death in an isolated network
        # Transient watchdog units enter ONLY the outer disposable netns.
        # The test removes those units and /run fixtures; no host firewall edit.
        run: sudo -n env KC_WATCHDOG_CI=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" unshare --net /usr/bin/python3 -I -B tests/test_secret_custody_network_watchdog.py --systemd

  custody-network-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test typed local evidence, bounds and private-output separation
        run: /usr/bin/python3 -I -B tests/test_secret_custody_network_dependencies.py
      - name: Test actual Ubuntu local readers with sanitized output
        run: sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" /usr/bin/python3 -I -B tests/test_secret_custody_network_dependencies.py --ci-host

  custody-network-dhcpv4:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test DHCP fixture parser and host-namespace guard
        run: /usr/bin/python3 -I -B tests/test_secret_custody_network_dhcp.py
      - name: Test actual networkd renewal, rebinding and lease expiry
        # Private net/mount namespaces and runtime/config; never host networkd.
        # Fixed local DHCP server only; no external route from the peer namespace.
        run: sudo -n env KC_DHCP_CI=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" unshare --net /usr/bin/python3 -I -B tests/test_secret_custody_network_dhcp.py --systemd

  custody-raw-packet-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Test raw packet fixture guards and packet checksums
        run: /usr/bin/python3 -I -B tests/test_secret_custody_raw_packet.py
      - name: Measure packet hooks and capability denial in disposable namespaces
        # Fixed veth pair only; no physical/cloud interface or live policy.
        run: sudo -n env KC_RAW_PACKET_CI=1 GITHUB_ACTIONS="$GITHUB_ACTIONS" unshare --net /usr/bin/python3 -I -B tests/test_secret_custody_raw_packet.py --kernel
