name: aws observation offline contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'review/aws_*'
      - 'tests/test_aws_oidc_readonly_observation.py'
      - '.github/workflows/aws-*'
      - 'AWS_GITHUB_OIDC_READONLY_OBSERVATION.md'
      - 'WORK_RESUME.md'
      - 'WORK_STATUS.md'
  push:
    branches: [main]
    paths:
      - 'review/aws_*'
      - 'tests/test_aws_oidc_readonly_observation.py'
      - '.github/workflows/aws-*'
      - 'AWS_GITHUB_OIDC_READONLY_OBSERVATION.md'
      - 'WORK_RESUME.md'
      - 'WORK_STATUS.md'

permissions:
  contents: read

jobs:
  synthetic-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline validators
        run: python -m pip install pytest==8.3.5 cfn-lint==1.57.1
      - name: Validate OIDC CloudFormation template offline
        run: cfn-lint -r ap-northeast-1 -t review/aws_github_oidc_readonly_role.yaml
      - name: Check shell syntax
        run: bash -n review/aws_lightsail_readonly_observation.sh
      - name: Verify synthetic catalog rejection without AWS credentials
        run: python -m pytest -q tests/test_aws_oidc_readonly_observation.py
