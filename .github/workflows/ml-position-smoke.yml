name: lightgbm position-model smoke

on:
  push:
    branches:
      - main
      - dev-offline-evaluation-v1
    paths:
      - 'ml/**'
      - 'tests/ml_position_smoke.py'
      - 'tests/test_offline_evaluation.py'
      - '.github/workflows/ml-position-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ml/**'
      - 'tests/ml_position_smoke.py'
      - 'tests/test_offline_evaluation.py'
      - '.github/workflows/ml-position-smoke.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install offline ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run position-model train and inference smoke
        run: python tests/ml_position_smoke.py
      - name: Run paired holdout and leakage checks
        run: python tests/test_offline_evaluation.py
