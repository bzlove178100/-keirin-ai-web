name: lightgbm position-model smoke

on:
  push:
    branches:
      - main
      - dev-offline-evaluation-v1
    paths:
      - 'ml/**'
      - 'model-web-response.js'
      - 'model-owner-preview.js'
      - 'index.html'
      - 'tests/ml_position_smoke.py'
      - 'tests/test_offline_preview.py'
      - 'tests/test_offline_preview_ui.cjs'
      - 'tests/test_category_selection.py'
      - 'tests/test_model_history.py'
      - 'tests/test_held_history*'
      - 'prospective-tools*'
      - 'tests/test_synthetic_workbench*'
      - 'tests/test_keirin_dev_deployment_package.py'
      - 'tests/test_web_dry_run.cjs'
      - 'supabase/functions/predict-engine-dev/**'
      - 'supabase/functions/history-builder-dev/**'
      - 'supabase/functions/history-pipeline-dev/**'
      - 'supabase/functions/backtest-engine-dev/**'
      - 'supabase/functions/_shared/race_probability.ts'
      - 'tests/test_offline_evaluation.py'
      - 'tests/test_historical*.py'
      - 'tests/historical_training_smoke.py'
      - 'tests/test_prospective_pipeline_e2e.py'
      - '.github/workflows/ml-position-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ml/**'
      - 'model-web-response.js'
      - 'model-owner-preview.js'
      - 'index.html'
      - 'tests/ml_position_smoke.py'
      - 'tests/test_offline_preview.py'
      - 'tests/test_offline_preview_ui.cjs'
      - 'tests/test_category_selection.py'
      - 'tests/test_model_history.py'
      - 'tests/test_held_history*'
      - 'prospective-tools*'
      - 'tests/test_synthetic_workbench*'
      - 'tests/test_keirin_dev_deployment_package.py'
      - 'tests/test_web_dry_run.cjs'
      - 'supabase/functions/predict-engine-dev/**'
      - 'supabase/functions/history-builder-dev/**'
      - 'supabase/functions/history-pipeline-dev/**'
      - 'supabase/functions/backtest-engine-dev/**'
      - 'supabase/functions/_shared/race_probability.ts'
      - 'tests/test_offline_evaluation.py'
      - 'tests/test_historical*.py'
      - 'tests/historical_training_smoke.py'
      - 'tests/test_prospective_pipeline_e2e.py'
      - '.github/workflows/ml-position-smoke.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install offline ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run synthetic Web prediction to history and evaluation checks
        run: node tests/test_web_dry_run.cjs
      - name: Run offline preview validation and escaping checks
        run: python -m unittest discover -s tests -p 'test_offline_preview.py' -v
      - name: Run frozen ML snapshot, settlement and review contracts
        run: python -m unittest discover -s tests -p 'test_model_history.py' -v
      - name: Run synthetic cross-engine held event transfer contracts
        run: python -m unittest discover -s tests -p 'test_held_history_transfer.py' -v
      - name: Run synthetic held-event review and conflict checks
        run: python -m unittest discover -s tests -p 'test_held_history_review.py' -v
      - name: Run local synthetic workbench API and boundary checks
        env:
          OMP_NUM_THREADS: '2'
        run: python -m unittest discover -s tests -p 'test_synthetic_workbench*.py' -v
      - name: Run deployment package and rollback integrity checks
        run: python -m unittest tests.test_keirin_dev_deployment_package -v
      - name: Run position-model train and inference smoke
        env:
          OMP_NUM_THREADS: '2'
          KEIRIN_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/keirin-offline-preview
        run: python tests/ml_position_smoke.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check owner API module graph without credentials or deployment
        run: >-
          deno check
          supabase/functions/predict-engine-dev/index.ts
          supabase/functions/history-builder-dev/index.ts
          supabase/functions/history-pipeline-dev/index.ts
          supabase/functions/backtest-engine-dev/index.ts
      - name: Check model category selection against the existing TypeScript policy
        run: python -m unittest discover -s tests -p 'test_category_selection.py' -v
      - name: Check generated preview in Chrome at phone and desktop widths
        env:
          KEIRIN_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/keirin-offline-preview
        run: |
          npm install --prefix "$RUNNER_TEMP/keirin-preview-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          export KEIRIN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/keirin-preview-browser/node_modules/playwright"
          export KEIRIN_BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          test -n "$KEIRIN_BROWSER_EXECUTABLE"
          node tests/test_held_history_ui.cjs
          node tests/test_held_history_owner_ui.cjs
          node tests/test_offline_preview_ui.cjs
          node tests/test_synthetic_workbench_ui.cjs
          node tests/test_synthetic_workbench_restart_ui.cjs
          node tests/test_synthetic_workbench_owner_web_ui.cjs
      - name: Run paired holdout and leakage checks
        run: python tests/test_offline_evaluation.py
      - name: Run historical review and chronological checks
        run: python -m unittest discover -s tests -p 'test_historical*.py' -v
      - name: Run synthetic historical training and held-out evaluation
        env:
          OMP_NUM_THREADS: '2'
        run: python tests/historical_training_smoke.py
      - name: Run prospective snapshot-to-evaluation end-to-end check
        run: python tests/test_prospective_pipeline_e2e.py
