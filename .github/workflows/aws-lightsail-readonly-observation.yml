name: aws lightsail read-only observation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_READONLY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: github-lightsail-readonly-observation

      - name: Observe Lightsail candidate
        env:
          AWS_REGION: ap-northeast-1
        run: bash review/aws_lightsail_readonly_observation.sh
