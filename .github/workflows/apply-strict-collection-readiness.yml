name: apply strict prospective readiness

on:
  push:
    branches:
      - main
    paths:
      - tools/patch_strict_collection_readiness.py
      - tests/test_collection_status_ui.cjs
      - .github/workflows/apply-strict-collection-readiness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply strict readiness UI
        run: python tools/patch_strict_collection_readiness.py
      - name: Verify base collection patch remains idempotent
        run: |
          python tools/patch_collection_progress_ui.py
          git diff --exit-code -- tools/patch_collection_progress_ui.py tests/test_collection_status_ui.cjs prospective-tools-core.js
      - name: Run strict collection UI checks
        run: node tests/test_collection_status_ui.cjs
      - name: Run browser-local prospective checks
        run: node tests/test_prospective_tools.cjs
      - name: Run Web capture checks
        run: node tests/test_web_capture.cjs
      - name: Commit generated Web change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated Web change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: use strict prospective readiness in Web"
          git push origin HEAD:main
