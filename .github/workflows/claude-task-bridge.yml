name: Claude task bridge (opt-in, disabled by default)

# Only an exact owner-posted issue comment can request a run after a separate
# repository variable is deliberately enabled. This does not schedule jobs.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude-task:
    if: ${{ github.event.action == 'created' && github.event.comment.body == '/claude-run' && github.event.sender.login == 'bzlove178100' && github.event.issue.user.login == 'bzlove178100' && github.event.issue.state == 'open' && github.event.issue.pull_request == null && vars.CLAUDE_TASK_BRIDGE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: claude-task-bridge-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Require separately configured Pro OAuth credential
        env:
          CLAUDE_BRIDGE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_BRIDGE_TOKEN:-}" ]; then
            echo "::error title=Claude OAuth token missing::Set CLAUDE_CODE_OAUTH_TOKEN after authorization; no API key fallback."
            exit 2
          fi

      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Implement owner-approved Issue with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          claude_args: |
            --max-turns 8
            --disallowedTools "Bash,WebFetch,WebSearch"
          prompt: |
            Work ONLY on GitHub Issue #${{ github.event.issue.number }} in this repository.
            Read the issue requirements, AGENTS.md, SOURCE_ACQUISITION_STATUS.md,
            and the smallest relevant source files. Check latest main/open PRs for overlap.
            Do not repeat the full repository survey or generate lengthy reports.
            Keep existing requirements and stop conditions; KEIRIN.JP HOLD is mandatory.
            NEVER fetch race/provider data or switch endpoints; do not reuse saved
            source records as new training evidence.
            No production predictions, DB writes, real ML training, secret access,
            AWS/Supabase operations, deployment, external inquiries, or paid resources.
            Change only the task-approved implementation/tests on a new branch.
            Do not execute shell commands or external tools; let pull-request CI run
            the relevant synthetic and regression tests. Report all tests as NOT RUN
            until the actual CI confirms them. Never assume tests passed.
            Do not change AGENTS.md, WORK_STATUS.md, WORK_RESUME.md or other
            parallel task documents. If a blocker or conflicting PR appears, stop.
            Commit and push the changes to a new Claude task branch only.
            The next workflow step will open a draft PR. NEVER merge or deploy.
            Report the PR link, tests, and blockers in 300 Japanese characters or less.

      - name: Open draft PR and link it from the Issue
        if: ${{ steps.claude.outputs.conclusion == 'success' && steps.claude.outputs.branch_name != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_BRANCH" =~ ^claude/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=Unexpected branch name::No pull request created."
            exit 2
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Missing job token::No pull request created."
            exit 2
          fi
          # Enforce a pilot-only repository scope, independent of the model's prompt.
          # Future workflows need separately reviewed permission/scoping changes.
          changed="$(gh api "repos/$GH_REPO/compare/main...$SOURCE_BRANCH" --jq '.files[].filename')"
          if [ -z "$changed" ]; then
            echo "::error title=No verified code diff::No pull request created."
            exit 2
          fi
          while IFS= read -r filename; do
            case "$filename" in
              ml/*.py|tests/*.py) ;;
              *)
                echo "::error title=Unexpected file scope::No PR for $filename."
                exit 2
                ;;
            esac
          done <<< "$changed"
          existing="$(gh pr list --repo "$GH_REPO" --state open --head "$SOURCE_BRANCH" --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "An open PR already exists for the Claude branch; do not duplicate it."
            exit 0
          fi
          pr_url="$(gh pr create --repo "$GH_REPO" --draft --base main --head "$SOURCE_BRANCH" --title "Claude task #$ISSUE_NUMBER (review required)" --body "Candidate implementation for Issue #$ISSUE_NUMBER. Human review and CI validation are required. No auto-merge or production activation.")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Claude produced a draft PR for review: $pr_url. No merge or deployment was performed."
