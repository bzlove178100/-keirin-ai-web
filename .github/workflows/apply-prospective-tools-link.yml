name: apply prospective tools launcher

on:
  push:
    branches:
      - main
    paths:
      - tools/patch_prospective_tools_link.py
      - tests/test_prospective_tools_link.cjs
      - .github/workflows/apply-prospective-tools-link.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply prospective tools launcher
        run: python tools/patch_prospective_tools_link.py
      - name: Run launcher checks
        run: node tests/test_prospective_tools_link.cjs
      - name: Run Web capture checks
        run: node tests/test_web_capture.cjs
      - name: Commit generated Web change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated Web change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: link Web to prospective tools"
          git push origin HEAD:main
