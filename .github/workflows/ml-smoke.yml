name: lightgbm offline smoke

on:
  push:
    branches:
      - dev-lightgbm-pipeline-v1
    paths:
      - 'ml/**'
      - 'tests/ml_smoke.py'
      - '.github/workflows/ml-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ml/**'
      - 'tests/ml_smoke.py'
      - '.github/workflows/ml-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install offline ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Run synthetic LightGBM smoke training
        run: python tests/ml_smoke.py
