name: "Claude development task (approval queue)"
description: "Small, synthetic-only code tasks; the owner must separately authorize automated execution"
title: "[Claude task] "
body:
  - type: markdown
    attributes:
      value: |
        This issue does not automatically run Claude. After the separately approved feature flag and token are configured, the owner can comment exactly `/claude-run` once to start it. Never include secrets, private race data, or credentials.
  - type: textarea
    id: purpose
    attributes:
      label: Goal and expected behavior
      description: "One bounded development change."
      placeholder: "Describe a small synthetic-only change. First check for overlap with unpublished commit 9fbb95d."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed Python files
      description: "One exact path per line, 1–4 existing regular files directly under ml/ or tests/. No prose, wildcards, new files or nested paths. Each file must be at most 24 KB; total 60 KB."
      placeholder: |
        ml/settle_snapshot.py
        tests/test_settle_snapshot.py
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Synthetic tests and acceptance criteria
      placeholder: "Specify synthetic tests and expected outcomes. Generated code is NOT RUN; review before approving CI. Draft PR only."
    validations:
      required: true
  - type: textarea
    id: safeguards
    attributes:
      label: Safety or permission boundaries
      value: |
        Keep KEIRIN.JP HOLD and all existing production/data/credential stops.
        No external race-data collection, real training, DB/cloud writes, paid resources, or merge.
    validations:
      required: true
